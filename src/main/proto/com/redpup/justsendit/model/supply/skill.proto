edition = "2023";

package com.redpup.justsendit.model.supply;

option java_multiple_files = true;
option java_package = "com.redpup.justsendit.model.supply.proto";

import "com/redpup/justsendit/model/supply/icon.proto";
import "com/redpup/justsendit/model/common.proto";
import "com/redpup/matchers/matcher.proto";
import "google/protobuf/empty.proto";

/** A list of skill cards. */
message SkillCardList {
  repeated SkillCard cards = 1;
}

/** Types of skill cards. */
enum SkillCardType {
  SKILL_CARD_TYPE_UNKNOWN = 0;
  SKILL_CARD_TYPE_STARTER = 1;
  SKILL_CARD_TYPE_UPGRADE = 2;
}

/** A skill card in a player's deck, discard, hand, play, or the shop. */
message SkillCard {
  // Name of the image file of this card.
  string filename = 1;
  // Name of this card.
  string name = 2;
  // Type of this card.
  SkillCardType type = 3;
  // Cost of this card.
  uint32 cost = 4;

  // Number of dice on this card, by color.
  uint32 green_dice = 5;
  uint32 blue_dice = 6;
  uint32 black_dice = 7;

  // Icons on this card, if any.
  repeated Icon icons = 8;

  // When this card's effects occur and effects, in order. If none, category
  // is unset. EffectCondition only set if there is a condition; unset otherwise.
  EffectCategory category = 9;
  SkillCardEffectCondition effect_condition = 10;
  SkillCardEffectCost effect_cost = 12;
  repeated SkillCardEffect effects = 13;
  SkillCardEffectRepeat effect_repeat = 14;

  // Flavor text of this card.
  string flavor_text = 15;

  // Computed attributes of this card.
  message Computed {
    // Expected value of dice.
    double dice_expected_value = 1;
    // Expected value of icons.
    double icon_expected_value = 2;
    // Expected value of effects. If no effects, this is 0.
    double effect_expected_value = 3;
    // Total expected value. Note that this is not necessarily the sum of the
    // above for some effect categories.
    double total_expected_value = 4;
    // Suggested cost based on the total_expected_value and relative to other
    // cards
    uint32 suggested_cost = 5;
  }
  Computed computed = 16;
}

/** Condition for skill card effects to activate. */
message SkillCardEffectCondition {
  oneof condition {
    // Matches when you succeed a tile.
    google.protobuf.Empty success = 1;
    // Matches when you fail a tile.
    google.protobuf.Empty failure = 2;
    // Checks if the next card's cost matches this matcher.
    // Does nothing if there is no next card.
    matchers.Matcher next_card_cost = 3;
  }
}

/** Cost for skill card effects to activate. */
message SkillCardEffectCost {
  oneof cost {
    // Discard a card from your hand.
    google.protobuf.Empty discard_card = 1;
    // Remove (pay) a die matching this matcher as a cost. Use
    // `constant_matcher: true` for "any color" (Remove Wild).
    matchers.Matcher remove_die = 2;
  }
}

/** One of the effects on a skill card. */
message SkillCardEffect {
  // The action performed when the condition (if any) is met.
  oneof effect {
    AlterDieEffect alter_die = 1;
    GainEffect gain = 2;
    google.protobuf.Empty ignore_wobble = 3 [deprecated = true];
    CardEffect card_effect = 4;
    // Activate the effect of the card played directly below this one an
    // additional time.
    google.protobuf.Empty reactivate_following = 5;
    // Discard any number of cards from hand, then draw that many.
    google.protobuf.Empty filter_hand = 6;
    // Replenish the shop's face-up offerings.
    google.protobuf.Empty replenish_shop = 7;
    // Take an additional turn after this one.
    google.protobuf.Empty extra_turn = 8;
    // Gain this card's own icon tags an additional time.
    google.protobuf.Empty gain_own_tags = 9;
    // Gain the icon tags of the card played directly below this one an
    // additional time.
    google.protobuf.Empty gain_tags_below = 10;
    // At the end of the turn, draw a different card from the play area back to
    // hand.
    google.protobuf.Empty draw_from_play = 11;
    // Move one board tile in any direction.
    google.protobuf.Empty move_tile = 12;
    // Gain Fun equal to the cost of the next card (engine-defined "next").
    google.protobuf.Empty gain_fun_equal_to_next_card_cost = 13;
    // Gain Fun equal to the value rolled, corresponding to the die removed
    // for the cost paid.
    google.protobuf.Empty gain_fun_equal_to_value_rolled = 14;
  }
}

/** Governs how many times a SkillEffect's action is repeated. */
message SkillCardEffectRepeat {
  oneof repeat {
    // Once per skill card below this one.
    google.protobuf.Empty skill_card_below = 1;
    // Once per skill card above this one.
    google.protobuf.Empty skill_card_above = 2;
    // Once per Wobble token.
    google.protobuf.Empty wobble = 3;
    // Once per icon tag on cards above that also appear on this card.
    google.protobuf.Empty matching_tag_on_card_above = 4;
    // Once per die showing a specific value and matching the given color.
    matchers.Matcher matching_die = 5;
  }
}

/** An effect that alters a die. */
message AlterDieEffect {
  // Matcher for dice that are allowed to be selected for this altering.
  matchers.Matcher die_matcher = 1;

  oneof effect {
    // Rerolls the selected die.
    google.protobuf.Empty reroll = 2;
    // Nudge the selected die by the given value, clamped on valid values.
    uint32 nudge = 3 [deprecated = true];
  }
}

/** An effect that causes gaining some value. */
message GainEffect {
  oneof gain {
    uint32 skill = 1;
    uint32 points = 2;
    uint32 buys = 3;
    uint32 trashes = 4;
    Die die = 5;
  }
}

/** An effect that moves skill cards between zones. */
message CardEffect {
  SkillCardZone source_zone = 1;
  SkillCardZone destination_zone = 2;
  uint32 count = 3;
}

/** Parameters used to compute skill card values. */
message SkillCardComputationValues {
  // Value of drawing a card.
  double cardDraw = 1;
  // Value of picking the best of two cards.
  double cardFilter2 = 2;
  // Value of picking the best of three cards.
  double cardFilter3 = 3;
  // Value of trashing a card.
  double trashCard = 4;
  // Value of activating an effect again.
  double reactivate = 5;
}

/** List of SkillCardComputationValues for library interop. */
message SkillCardComputationValuesList {
  repeated SkillCardComputationValues values = 1;
}
